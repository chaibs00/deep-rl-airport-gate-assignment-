# Reward values (see README, Reward Function).
reward:
  contact: 10.0           # flight assigned to a contact gate
  remote: -10.0           # flight sent to a remote stand
  max_distance_penalty: 3.0   # penalty for the farthest contact gate
  size_mismatch: 1.0      # penalty per size level of difference (aircraft vs gate)

# Normalization constants for the state vector (minutes).
state:
  max_wait: 240           # "time until free" is capped at 4 hours
  max_turnaround: 240



# DQN hyperparameters.
dqn:
  hidden: 128              # neurons per hidden layer
  lr: 0.001                # learning rate (Adam)
  gamma: 0.99              # discount factor
  batch_size: 64
  buffer_capacity: 50000   # transitions kept in memory (~500 days)
  learning_starts: 1000    # transitions collected before learning (~10 days)
  target_update: 500       # steps between target network updates
  epsilon_start: 1.0       # fully random at the beginning
  epsilon_end: 0.05        # 5% random at the end
  epsilon_decay_steps: 20000   # steps to go from start to end (~200 days)
  # DQN variants.
  double: false            # Double DQN target
  dueling: false           # dueling network architecture



# Training.
training:
  episodes: 500            # simulated days per training run
  seeds: [0, 1, 2, 3, 4]   # one training run per seed
  eval_every: 25           # evaluate every N episodes
  val_days: 10             # number of validation days
  val_seed_start: 500      # validation days use seeds 500, 501, ...
  results_dir: results



# The three learning agents: each one changes a single option.
agents:
  dqn: {double: false, dueling: false}
  double_dqn: {double: true, dueling: false}
  dueling_dqn: {double: true, dueling: true}



# Final evaluation on unseen test days.
evaluation:
  test_days: 20
  test_seed_start: 1000    # test days use seeds 1000, 1001, ...
  random_runs: 5           # the random agent is run with 5 different seeds



# Figures.
plots:
  gantt_day: 1000          # test day shown in the Gantt chart
  gantt_agent: dueling_dqn # learning agent compared with greedy
  gantt_seed: 0            # which trained seed to use



